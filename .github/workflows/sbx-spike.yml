name: sbx-spike

# Throwaway spike, answering two questions before any of this is worth wiring
# into `review`. First, can a GitHub-hosted runner run a Docker Sandboxes
# microVM at all? Docker's blog says ubuntu-24.04 works as-is, GitHub's docs say
# nested virtualization is unsupported, so measure rather than trust either.
# Second, can Claude run non-interactively inside one? See the block further
# down for that.
# `push` as well as `workflow_dispatch`: the dispatch trigger only registers
# once the file is on the default branch, and this should not land on master
# just to be run once.
on:
  workflow_dispatch:
  push:
    branches: [sbx-spike]

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  preflight:
    # Pinned rather than `ubuntu-latest`: docker-sbx requires Ubuntu 24.04+, and
    # the KVM device this depends on is exactly what is under test.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Check KVM availability
        run: |
          if ! lsmod | grep -q kvm; then
            echo "::error::KVM kernel module is not loaded; docker-sbx cannot run here"
            exit 1
          fi
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing; docker-sbx cannot run here"
            exit 1
          fi
          ls -l /dev/kvm
          lsmod | grep kvm

      - name: Install docker-sbx
        run: |
          # REPO_ONLY, since the runner already has Docker Engine.
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx
          sbx version
          # The device exists but is not writable by the runner user.
          sudo chmod 666 /dev/kvm

      - name: Start daemon and authenticate
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          nohup sbx daemon start > /tmp/sbx-daemon.log 2>&1 &
          for _ in $(seq 30); do
            if sbx daemon status 2>/dev/null | grep -qi running; then
              break
            fi
            sleep 1
          done
          if ! sbx daemon status 2>/dev/null | grep -qi running; then
            echo "::error::sbx daemon did not start"
            cat /tmp/sbx-daemon.log >&2
            exit 1
          fi
          # Two separate sessions: the Docker CLI's and sbx's own. sbx refuses to
          # operate unauthenticated even though the template images are public.
          printf '%s' "$DOCKER_PAT" | docker login --username "$DOCKER_USERNAME" --password-stdin
          printf '%s' "$DOCKER_PAT" | sbx login --username "$DOCKER_USERNAME" --password-stdin

      # `balanced` rather than the `allow-all` gh-aw falls back to, so this also
      # reports whether deny-by-default egress is compatible with a workspace
      # mount. gh-aw's script claims allow-all is "required for mount policy".
      - name: Initialize network policy
        run: sbx policy init balanced

      - name: Create sandbox and verify the workspace mount
        run: |
          echo "sbx-spike-marker" > "$GITHUB_WORKSPACE/marker.txt"
          echo "y" | sbx create shell --name spike "$GITHUB_WORKSPACE"
          sbx exec spike uname -a
          # Proves the mount is readable inside the microVM, not just that the
          # VM booted.
          got=$(sbx exec spike cat "$GITHUB_WORKSPACE/marker.txt" | tr -d '\r\n')
          if [ "$got" != "sbx-spike-marker" ]; then
            echo "::error::workspace mount not readable inside the sandbox (got '$got')"
            exit 1
          fi
          echo "workspace mount verified"

      - name: Report egress under the balanced policy
        continue-on-error: true
        run: |
          for host in https://api.anthropic.com https://pypi.org https://example.com; do
            code=$(sbx exec spike curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$host" || echo "err")
            echo "$host -> $code"
          done

      # Spike 2 starts here. Question: can Claude run non-interactively inside a
      # sandbox? docker/sbx-releases#53 reports that a login shell works while
      # `sbx run` and direct `exec` both fail with "Not logged in", which is
      # exactly the shape `review` needs. Uses the API key rather than the
      # gateway so a failure isolates to #53 and not to Databricks.
      - name: Store the Anthropic credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.EXPERIMENTAL_ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::EXPERIMENTAL_ANTHROPIC_API_KEY is empty"
            exit 1
          fi
          printf '%s' "$ANTHROPIC_API_KEY" | sbx secret set anthropic
          sbx secret ls

      - name: Create the claude sandbox
        run: |
          echo "y" | sbx create claude "$GITHUB_WORKSPACE" --name claude-spike
          # Reports `none` when no credential reached the VM, which is what the
          # local run showed before any secret was stored.
          # shellcheck disable=SC2016  # must expand inside the VM, not here
          sbx exec claude-spike bash -lc 'echo "SBX_CRED_ANTHROPIC_MODE=$SBX_CRED_ANTHROPIC_MODE"'

      # All three shapes, each allowed to fail, so one run reports which work
      # instead of stopping at the first failure.
      - name: Run claude three ways
        id: three-ways
        continue-on-error: true
        run: |
          marker="SPIKE2_OK"
          prompt="Reply with exactly: $marker"
          rc=0

          try() {
            local label=$1
            shift
            local out
            if out=$(timeout 300 "$@" 2>&1); then
              if grep -q "$marker" <<<"$out"; then
                echo "$label: PASS"
                return 0
              fi
              echo "$label: RAN BUT NO MARKER"
            else
              echo "$label: FAIL (exit $?)"
            fi
            # Trimmed: the reply is short, and a failure message is what matters.
            sed -n '1,10p' <<<"$out" | sed 's/^/    /'
            return 1
          }

          try "sbx run (what review needs)" sbx run --name claude-spike -- -p "$prompt" || rc=1
          try "sbx exec claude (direct)" sbx exec claude-spike claude -p "$prompt" || rc=1
          try "sbx exec bash -lc (login shell)" sbx exec claude-spike bash -lc "claude -p '$prompt'" || rc=1

          exit "$rc"

      - name: Summarize
        if: always()
        env:
          OUTCOME: ${{ steps.three-ways.outcome }}
        run: |
          echo "three-ways outcome: $OUTCOME"
          echo "A failure here is the expected shape of docker/sbx-releases#53."

      # Spike 3. The gateway path `review` actually uses: a Databricks bearer
      # rather than an Anthropic key, reached at a host the `balanced` policy
      # blocks by default. `set-custom` should keep the bearer on the host and
      # leave only a placeholder in the VM.
      - name: Configure the gateway credential
        env:
          DATABRICKS_GATEWAY_HOST: ${{ secrets.DATABRICKS_GATEWAY_HOST }}
          DATABRICKS_GATEWAY_CLIENT_ID: ${{ secrets.DATABRICKS_GATEWAY_CLIENT_ID }}
          DATABRICKS_GATEWAY_CLIENT_SECRET: ${{ secrets.DATABRICKS_GATEWAY_CLIENT_SECRET }}
        run: |
          # An OAuth token or api key on the `anthropic` service takes precedence
          # at runtime, so spike 2's key has to go before this means anything.
          sbx secret rm anthropic -f || true

          TOKEN=$(curl -sS --max-time 15 \
            -u "$DATABRICKS_GATEWAY_CLIENT_ID:$DATABRICKS_GATEWAY_CLIENT_SECRET" \
            -d grant_type=client_credentials -d scope=ai-gateway \
            "$DATABRICKS_GATEWAY_HOST/oidc/v1/token" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::gateway token exchange failed"
            exit 1
          fi
          # Minted at runtime, so not masked automatically.
          echo "::add-mask::$TOKEN"

          host=${DATABRICKS_GATEWAY_HOST#https://}
          host=${host%%/*}
          echo "::add-mask::$host"

          base_url="${DATABRICKS_GATEWAY_HOST%/}/ai-gateway/anthropic"
          echo "::add-mask::$base_url"
          echo "ANTHROPIC_BASE_URL=$base_url" >> "$GITHUB_ENV"
          tags=$(jq -cn --arg repository "$GITHUB_REPOSITORY" --arg task sbx-spike '{$repository, $task}')
          echo "ANTHROPIC_CUSTOM_HEADERS=Databricks-Ai-Gateway-Request-Tags: $tags" >> "$GITHUB_ENV"

          # Global rather than --sandbox: a custom secret has to exist before the
          # sandbox is created for its env var to be injected at all.
          sbx policy allow network "$host"
          sbx secret set-custom --host "$host" --env ANTHROPIC_AUTH_TOKEN --token "$TOKEN"
          sbx secret ls

      - name: Create the gateway sandbox
        env:
          # The same three `review` sets. The permission classifier picks its
          # model from the aliases rather than `--model`, and the gateway's beta
          # allowlist rejects some of the CLI's experimental betas with 400.
          ANTHROPIC_DEFAULT_SONNET_MODEL: databricks-claude-sonnet-5
          ANTHROPIC_DEFAULT_OPUS_MODEL: databricks-claude-opus-5
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
        run: |
          # ANTHROPIC_AUTH_TOKEN is deliberately absent here: set-custom injects
          # the placeholder, and passing the real bearer would defeat the point.
          echo "y" | sbx create claude "$GITHUB_WORKSPACE" --name gw-spike \
            -e ANTHROPIC_BASE_URL -e ANTHROPIC_CUSTOM_HEADERS \
            -e ANTHROPIC_DEFAULT_SONNET_MODEL -e ANTHROPIC_DEFAULT_OPUS_MODEL \
            -e CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS

      - name: Verify the bearer never entered the VM
        run: |
          # shellcheck disable=SC2016  # must expand inside the VM, not here
          inside=$(sbx exec gw-spike bash -lc 'printf "%s" "$ANTHROPIC_AUTH_TOKEN"')
          if [ -z "$inside" ]; then
            echo "::error::ANTHROPIC_AUTH_TOKEN was not injected into the sandbox"
            exit 1
          fi
          case "$inside" in
            sbx-cs-*) echo "VM holds a placeholder (${inside%%-*}-cs-...), not the bearer" ;;
            *) echo "::error::ANTHROPIC_AUTH_TOKEN in the VM is not a placeholder"; exit 1 ;;
          esac

      - name: Run claude through the gateway
        id: gateway-claude
        continue-on-error: true
        run: |
          marker="SPIKE3_OK"
          # The gateway names each endpoint `databricks-<model>`; the CLI's own
          # default is not one it serves.
          out=$(timeout 300 sbx exec gw-spike \
            claude --model databricks-claude-sonnet-5 -p "Reply with exactly: $marker" 2>&1) || true
          if grep -q "$marker" <<<"$out"; then
            echo "gateway: PASS"
          else
            echo "gateway: FAIL"
            sed -n '1,15p' <<<"$out" | sed 's/^/    /'
            exit 1
          fi

      - name: Diagnostics
        if: always()
        run: |
          sbx diagnose || true
          cat /tmp/sbx-daemon.log || true

      - name: Tear down
        if: always()
        run: |
          for s in spike claude-spike gw-spike; do
            sbx stop "$s" || true
            sbx rm --force "$s" || true
          done

  # Spike 4. The custom template image, driving a real task: boot the dev server
  # and screenshot it. Separate job because it needs a checkout, and the sbx
  # setup is copied rather than shared since this is throwaway; a composite
  # action under .github/actions is the right shape if any of this lands.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk-space

      - name: Install docker-sbx
        run: |
          if ! lsmod | grep -q kvm || [ ! -e /dev/kvm ]; then
            echo "::error::no KVM on this runner"
            exit 1
          fi
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx
          sudo chmod 666 /dev/kvm

      - name: Start daemon and authenticate
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          nohup sbx daemon start > /tmp/sbx-daemon.log 2>&1 &
          for _ in $(seq 30); do
            if sbx daemon status 2>/dev/null | grep -qi running; then
              break
            fi
            sleep 1
          done
          printf '%s' "$DOCKER_PAT" | docker login --username "$DOCKER_USERNAME" --password-stdin
          printf '%s' "$DOCKER_PAT" | sbx login --username "$DOCKER_USERNAME" --password-stdin
          sbx policy init balanced

      # No registry round trip: `template load` takes the image straight from a
      # tar, so the spike needs no push credentials.
      - name: Build and load the custom template
        run: |
          docker build -f dev/Dockerfile.sandbox -t mlflow-sandbox:spike .
          docker save mlflow-sandbox:spike -o /tmp/mlflow-sandbox.tar
          sbx template load /tmp/mlflow-sandbox.tar
          sbx template ls

      - name: Store the Anthropic credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.EXPERIMENTAL_ANTHROPIC_API_KEY }}
        run: printf '%s' "$ANTHROPIC_API_KEY" | sbx secret set anthropic

      - name: Create the sandbox from the custom image
        env:
          MLFLOW_TRACKING_URI: sqlite:////tmp/ui-spike/mlflow.db
          # The CRA dev server treats warnings as errors when CI=true.
          CI: "false"
        run: |
          # The mount is the runner's checkout, owned by a different uid than the
          # image's `agent` user, and the dev server writes into it.
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          echo "y" | sbx create -t mlflow-sandbox:spike claude "$GITHUB_WORKSPACE" \
            --name ui-spike -e MLFLOW_TRACKING_URI -e CI

      - name: Verify the image carries the toolchain
        run: |
          # shellcheck disable=SC2016  # must expand inside the VM, not here
          sbx exec ui-spike bash -lc '
            for c in uv node npm yarn agent-browser claude; do
              printf "%s: " "$c"
              command -v "$c" >/dev/null 2>&1 && "$c" --version 2>&1 | head -1 || echo MISSING
            done
          '

      - name: Ask claude to boot the server and screenshot the home page
        id: ui-task
        continue-on-error: true
        env:
          PROMPT: |
            You are in a sandbox with the mlflow repo mounted. Boot the dev server and screenshot its home page.

            1. cd to the repo root (the directory containing pyproject.toml and dev/run_dev_server.py).
            2. Seed demo data so the page is not empty:
               uv run python -c "from mlflow.demo import generate_all_demos; generate_all_demos(refresh=True)"
            3. Start the server in the background:
               uv run dev/run_dev_server.py --stub-providers claude > /tmp/dev-server.log 2>&1 &
            4. Poll /tmp/dev-server.log for a line like "Frontend: http://localhost:PORT". This can take
               several minutes because it runs yarn install and uv sync first. Wait for the URL to answer
               a curl before continuing.
            5. Use agent-browser to open that URL and save a screenshot to /tmp/home.png.
            6. Print the resolved URL, then confirm /tmp/home.png exists and is non-empty.

            If a step fails, print the last 50 lines of /tmp/dev-server.log and stop.
        run: |
          mkdir -p /tmp/spike-out
          # Permissive by design: the isolation is the microVM, which is the whole
          # reason for running the agent in one.
          EXIT_CODE=0
          timeout 45m sbx exec ui-spike claude \
            --model claude-sonnet-5 \
            --max-budget-usd 5 \
            --dangerously-skip-permissions \
            --print \
            --verbose \
            --output-format stream-json \
            "$PROMPT" \
            | .claude/scripts/stream.sh /tmp/spike-out/agent.jsonl || EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "::warning::claude timed out after 45 minutes"
          fi
          exit "$EXIT_CODE"

      - name: Copy the screenshot out
        if: always()
        run: |
          mkdir -p /tmp/spike-out
          sbx cp ui-spike:/tmp/home.png /tmp/spike-out/home.png || echo "no screenshot produced"
          sbx exec ui-spike bash -lc 'tail -50 /tmp/dev-server.log' > /tmp/spike-out/dev-server.log 2>&1 || true
          ls -la /tmp/spike-out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-spike-output
          path: /tmp/spike-out
          if-no-files-found: warn
          retention-days: 1

      - name: Tear down
        if: always()
        run: |
          sbx stop ui-spike || true
          sbx rm --force ui-spike || true

  # Spike 5. Same task, weaker and cheaper boundaries, to price what sbx's
  # microVM actually costs. gVisor needs no KVM and no account; the hardened
  # container shares the runner's kernel and is the cheapest thing that still
  # keeps PR code away from the job's other credentials. Reuses the same image,
  # so the only variable is the runtime.
  runtimes:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk-space

      - name: Build the image
        run: docker build -f dev/Dockerfile.sandbox -t mlflow-sandbox:spike .

      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{.Runtimes}}'

      - name: Write the smoke script
        run: |
          cat > /tmp/smoke.sh <<'SH'
          #!/usr/bin/env bash
          # Boot the dev server and screenshot the home page, timing each phase.
          set -euo pipefail
          label=$1
          out=/work/out
          mkdir -p "$out"
          cd /work

          overall=$(date +%s)
          t=$(date +%s)
          uv sync --quiet
          echo "[$label] uv sync: $(( $(date +%s) - t ))s"

          t=$(date +%s)
          uv run python -c "from mlflow.demo import generate_all_demos; generate_all_demos(refresh=True)" > /dev/null 2>&1
          echo "[$label] demo seed: $(( $(date +%s) - t ))s"

          t=$(date +%s)
          nohup uv run dev/run_dev_server.py --stub-providers claude > "$out/dev-server.log" 2>&1 &
          url=""
          for _ in $(seq 1 150); do
            if [ -z "$url" ]; then
              url=$(grep -oE 'Frontend: http://localhost:[0-9]+' "$out/dev-server.log" 2>/dev/null | head -1 | grep -oE 'http://localhost:[0-9]+' || true)
            fi
            if [ -n "$url" ] && curl -fsS "$url" > /dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          if [ -z "$url" ] || ! curl -fsS "$url" > /dev/null 2>&1; then
            echo "[$label] FAIL: dev server never became ready"
            tail -40 "$out/dev-server.log"
            exit 1
          fi
          echo "[$label] dev server: $(( $(date +%s) - t ))s ($url)"

          t=$(date +%s)
          agent-browser open "$url"
          agent-browser wait 3000
          agent-browser screenshot "$out/home.png"
          echo "[$label] screenshot: $(( $(date +%s) - t ))s"
          ls -la "$out/home.png"
          echo "[$label] TOTAL: $(( $(date +%s) - overall ))s"
          SH
          chmod +x /tmp/smoke.sh

      # A clone per arm, so neither reuses the other's .venv or node_modules and
      # the timings mean something. --local hardlinks, so it is nearly free.
      - name: Prepare a workspace per arm
        run: |
          for arm in plain runsc; do
            git clone --local --quiet "$GITHUB_WORKSPACE" "/tmp/arm-$arm"
            chmod -R a+rwX "/tmp/arm-$arm"
          done

      - name: Arm 1, hardened container on the shared kernel
        id: arm-plain
        continue-on-error: true
        run: |
          docker run --rm \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            -v /tmp/arm-plain:/work -v /tmp/smoke.sh:/smoke.sh:ro \
            -e CI=false -e MLFLOW_TRACKING_URI=sqlite:////tmp/mlflow.db \
            mlflow-sandbox:spike bash /smoke.sh plain

      - name: Arm 2, gVisor
        id: arm-runsc
        continue-on-error: true
        run: |
          docker run --rm --runtime=runsc \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            -v /tmp/arm-runsc:/work -v /tmp/smoke.sh:/smoke.sh:ro \
            -e CI=false -e MLFLOW_TRACKING_URI=sqlite:////tmp/mlflow.db \
            mlflow-sandbox:spike bash /smoke.sh runsc

      - name: Collect
        if: always()
        env:
          PLAIN: ${{ steps.arm-plain.outcome }}
          RUNSC: ${{ steps.arm-runsc.outcome }}
        run: |
          echo "plain=$PLAIN runsc=$RUNSC"
          mkdir -p /tmp/runtime-out
          for arm in plain runsc; do
            if [ -d "/tmp/arm-$arm/out" ]; then
              mkdir -p "/tmp/runtime-out/$arm"
              cp -a "/tmp/arm-$arm/out/." "/tmp/runtime-out/$arm/" || true
            fi
          done
          find /tmp/runtime-out -type f -exec ls -la {} \;

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-comparison
          path: /tmp/runtime-out
          if-no-files-found: warn
          retention-days: 1

  # Spike 6. The credential property without sbx. sbx needs TLS interception
  # because it substitutes into arbitrary hosts; we own ANTHROPIC_BASE_URL, so a
  # single plaintext hop to a proxy that adds the header is enough. The container
  # holds only a worthless placeholder, which nginx replaces on the way out.
  proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk-space

      - name: Build the image
        run: docker build -f dev/Dockerfile.sandbox -t mlflow-sandbox:spike .

      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker

      - name: Start the injecting proxy
        env:
          DATABRICKS_GATEWAY_HOST: ${{ secrets.DATABRICKS_GATEWAY_HOST }}
          DATABRICKS_GATEWAY_CLIENT_ID: ${{ secrets.DATABRICKS_GATEWAY_CLIENT_ID }}
          DATABRICKS_GATEWAY_CLIENT_SECRET: ${{ secrets.DATABRICKS_GATEWAY_CLIENT_SECRET }}
        run: |
          GW_TOKEN=$(curl -sS --max-time 15 \
            -u "$DATABRICKS_GATEWAY_CLIENT_ID:$DATABRICKS_GATEWAY_CLIENT_SECRET" \
            -d grant_type=client_credentials -d scope=ai-gateway \
            "$DATABRICKS_GATEWAY_HOST/oidc/v1/token" | jq -r '.access_token // empty')
          if [ -z "$GW_TOKEN" ]; then
            echo "::error::gateway token exchange failed"
            exit 1
          fi
          echo "::add-mask::$GW_TOKEN"
          GW_HOST=${DATABRICKS_GATEWAY_HOST#https://}
          GW_HOST=${GW_HOST%%/*}
          echo "::add-mask::$GW_HOST"
          GW_TAGS=$(jq -cn --arg repository "$GITHUB_REPOSITORY" --arg task sbx-spike '{$repository, $task}')

          # No nginx variables here, so the heredoc can expand freely. Buffering
          # off in both directions: the API is SSE, and a proxy that batches it
          # would stall the agent rather than fail loudly.
          cat > /tmp/nginx.conf <<CONF
          events {}
          http {
            access_log /dev/stdout;
            server {
              listen 80;
              location / {
                proxy_pass https://${GW_HOST}/ai-gateway/anthropic/;
                proxy_set_header Host ${GW_HOST};
                proxy_set_header Authorization "Bearer ${GW_TOKEN}";
                proxy_set_header Databricks-Ai-Gateway-Request-Tags '${GW_TAGS}';
                proxy_http_version 1.1;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_read_timeout 600s;
                proxy_ssl_server_name on;
              }
            }
          }
          CONF
          chmod 600 /tmp/nginx.conf

          docker network create spike-net
          docker run -d --name gw-proxy --network spike-net \
            -v /tmp/nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:1.29-alpine
          sleep 3
          docker ps --filter name=gw-proxy --format '{{.Status}}'
          # gVisor brings its own network stack and owns loopback inside the
          # sandbox, so Docker's embedded resolver at 127.0.0.11 is unreachable
          # and the container name does not resolve. Pin the address instead.
          PROXY_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' gw-proxy)
          echo "PROXY_IP=$PROXY_IP" >> "$GITHUB_ENV"

      # Isolates the DNS failure from everything else: the same request by name
      # and by address, under the runtime that could not reach the proxy.
      - name: Name resolution under gVisor
        continue-on-error: true
        run: |
          echo "--- by name (expected to fail under runsc) ---"
          docker run --rm --runtime=runsc --network spike-net curlimages/curl:8.18.0 \
            -s -o /dev/null -w 'by name: %{http_code}\n' --max-time 20 \
            http://gw-proxy/v1/messages || echo "by name: unreachable"
          echo "--- by address ---"
          docker run --rm --runtime=runsc --network spike-net curlimages/curl:8.18.0 \
            -s -o /dev/null -w 'by address: %{http_code}\n' --max-time 20 \
            "http://${PROXY_IP}/v1/messages" || echo "by address: unreachable"

      - name: Confirm the proxy reaches the gateway
        run: |
          # A bare GET is not a valid API call; a response from the gateway
          # rather than a connection error is what proves the hop works.
          docker run --rm --network spike-net curlimages/curl:8.18.0 \
            -s -o /dev/null -w 'proxy -> gateway: %{http_code}\n' --max-time 20 \
            http://gw-proxy/v1/messages

      - name: Run claude with no bearer in the container
        id: proxy-claude
        continue-on-error: true
        env:
          ANTHROPIC_DEFAULT_SONNET_MODEL: databricks-claude-sonnet-5
          ANTHROPIC_DEFAULT_OPUS_MODEL: databricks-claude-opus-5
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
        run: |
          # gVisor as well, so this is the combined story: stronger boundary and
          # no credential inside it.
          docker run --rm --runtime=runsc --network spike-net \
            --add-host "gw-proxy:${PROXY_IP}" \
            -e ANTHROPIC_BASE_URL=http://gw-proxy \
            -e ANTHROPIC_AUTH_TOKEN=placeholder-not-a-real-credential \
            -e ANTHROPIC_DEFAULT_SONNET_MODEL \
            -e ANTHROPIC_DEFAULT_OPUS_MODEL \
            -e CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS \
            mlflow-sandbox:spike bash -lc '
              set -e
              # The CLI refuses to start without one, so the container holds a
              # worthless placeholder that nginx overwrites on the way out.
              if [ "${ANTHROPIC_AUTH_TOKEN:-}" != "placeholder-not-a-real-credential" ]; then
                echo "FAIL: expected the placeholder, got something else"
                exit 1
              fi
              if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
                echo "FAIL: a real api key is present in the container"
                exit 1
              fi
              echo "container holds only the placeholder: $ANTHROPIC_AUTH_TOKEN"
              claude --model databricks-claude-sonnet-5 -p "Reply with exactly: SPIKE6_OK"
            ' | tee /tmp/proxy-claude.log
          if grep -q SPIKE6_OK /tmp/proxy-claude.log; then
            echo "proxy: PASS"
          else
            echo "proxy: FAIL"
            exit 1
          fi

      - name: Proxy access log
        if: always()
        run: docker logs gw-proxy 2>&1 | tail -20

      - name: Tear down
        if: always()
        run: |
          docker rm -f gw-proxy || true
          docker network rm spike-net || true
